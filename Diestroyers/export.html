<style>
:root{--red:#e11919;--green:#2ecc71;--yellow:#f2c94c;--bad:#ff3434;--ink:#090909;--panel:#151515;--line:#303030}
body{background:radial-gradient(circle at 15% 0,rgba(225,25,25,.22),transparent 28%),#050505;color:#fff}
.export-shell{max-width:1560px;margin:0 auto;padding:28px 24px 60px}
.export-hero{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:26px 30px;background:linear-gradient(180deg,#191919,#0b0b0b);border:1px solid rgba(255,255,255,.09);border-radius:24px;box-shadow:0 20px 50px rgba(0,0,0,.45);position:relative;overflow:hidden}
.export-hero:before,.report-card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--red);box-shadow:0 0 22px rgba(225,25,25,.75)}
.export-title{font-size:48px;line-height:1;text-transform:uppercase;font-weight:900;margin:0}
.export-sub{font-size:20px;color:#bbb;margin-top:8px;font-weight:700}
.export-tabs{display:flex;gap:10px;flex-wrap:wrap}
.export-tabs button,.action-btn{font:900 18px Rajdhani,Arial;border-radius:999px;padding:12px 20px;border:1px solid rgba(255,255,255,.15);background:#171717;color:#fff;cursor:pointer;text-transform:uppercase;letter-spacing:.04em}
.export-tabs button.active,.action-btn.primary{background:linear-gradient(180deg,#c91515,#710808);border-color:#ff4949;box-shadow:0 0 20px rgba(225,25,25,.34)}
.actionbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:18px 0;flex-wrap:wrap}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.status-note{color:#aaa;font-size:16px;font-weight:700}
.report-card{position:relative;background:#fff;color:#111;border-radius:20px;overflow:hidden;margin-top:14px;box-shadow:0 24px 60px rgba(0,0,0,.5)}
.report, .report *{box-sizing:border-box}
.report{color:#111}
.report p,.report div,.report span,.report td,.report th,.report strong{color:inherit}
.report{padding:18mm 14mm 14mm;background:#fff;min-height:190mm}
.report-header{display:flex;align-items:center;justify-content:space-between;border-bottom:4px solid #151515;padding-bottom:10px;margin-bottom:12px}
.report-brand{display:flex;align-items:center;gap:14px}
.report-logo{width:82px;height:82px;border-radius:16px;background:#fff;display:flex;align-items:center;justify-content:center;border:2px solid #e11919;padding:6px;overflow:hidden;flex:0 0 auto}.report-logo img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.report-h1{font-size:30px;line-height:1;font-weight:900;text-transform:uppercase;color:#111}
.report-meta{font-size:12px;color:#555;text-align:right;font-weight:700}
.section-title{font-size:18px;text-transform:uppercase;letter-spacing:.04em;margin:14px 0 7px;border-left:5px solid #e11919;padding-left:9px;font-weight:900}
.summary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.summary-card{border:1px solid #d5d5d5;border-radius:10px;padding:9px 11px;background:#fafafa;color:#111}
.summary-card span{display:block;font-size:10px;text-transform:uppercase;color:#666;font-weight:800}

.report-table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:9px}
.report-table th{background:#151515;color:#fff;padding:6px 4px;text-transform:uppercase;letter-spacing:.02em;border:1px solid #333;font-size:8.5px}
.report-table td{padding:5px 4px;border:1px solid #d5d5d5;text-align:center;vertical-align:middle;font-weight:700;color:#111}

.report-table tr:nth-child(even) td{background:#f5f5f5}
.kpi-main{display:block;font-size:10px;font-weight:900}
.kpi-sub{display:block;font-size:7.5px;color:#555;margin-top:2px;white-space:nowrap}

.cell-close{background:#fff3c9!important;color:#735900!important}
.cell-bad{background:#ffe0e0!important;color:#801717!important}
.cell-empty{color:#777!important;background:#f4f4f4!important}
.cell-ok .kpi-main,.cell-ok .kpi-sub{color:#0d5f31!important}
.cell-close .kpi-main,.cell-close .kpi-sub{color:#735900!important}

.screen-hidden{display:none}

.report-card{border:1px solid rgba(255,255,255,.11)}

  min-height:88px;

}
.report-brand{min-width:0}

.report-logo img{width:100%;height:100%;object-fit:contain}
.report-h1{font-family:'Rajdhani',Arial,sans-serif;font-size:31px;color:#fff;letter-spacing:.03em}
.report-header .report-brand>div>div:last-child{color:#d4d4d4!important;font-size:11px!important;letter-spacing:.02em}
.report-meta{color:#e6e6e6;font-size:10px;line-height:1.45;min-width:190px}
.report-meta strong{color:#fff}
.section-title{
  font-family:'Rajdhani',Arial,sans-serif;

.report-table{font-size:8px;border-collapse:separate;border-spacing:0;width:100%;border:1px solid #c9c9c9;border-radius:8px;overflow:hidden}
.report-table th{

}

.report-table td{
  min-height:29px;

  border:0;
  border-right:1px solid #d8d8d8;
  border-bottom:1px solid #d8d8d8;

  background:#fff;
}
.report-table td:last-child{border-right:0}
.report-table tbody tr:last-child td{border-bottom:0}
.report-table tr:nth-child(even) td{background:#f6f6f6}
.report-table tr{break-inside:avoid;page-break-inside:avoid}
.kpi-main{font-size:9.2px;line-height:1.05;color:inherit!important}
.kpi-sub{font-size:6.5px;line-height:1.1;color:inherit!important;opacity:.78;white-space:normal}
.cell-ok{background:#dff3e6!important;color:#0b5a2b!important}
.cell-close{background:#fff1c7!important;color:#665000!important}
.cell-bad{background:#f9dddd!important;color:#741515!important}
.cell-empty{background:#ededed!important;color:#707070!important}
.ytd-total td{background:#dedede!important;border-top:2px solid #191919!important;color:#111!important}
.seller-page{page-break-before:always;margin-top:0;padding-top:2mm}
.report-footer{padding-top:6px;border-top:1px solid #d7d7d7;color:#666;font-size:7px}
.report-table thead{display:table-header-group}

@media(max-width:900px){.export-hero{align-items:flex-start;flex-direction:column}.summary-grid{grid-template-columns:1fr}.report-card{overflow:auto}.report{min-width:1120px}}
@media print{header.topbar,.export-hero,.actionbar{display:none!important}.export-shell{padding:0}.report-card{box-shadow:none;border-radius:0;margin:0}.report{padding:10mm}}
.compact-report{padding:8mm 9mm;min-height:0}.compact-report .report-header{padding:8px;margin-bottom:7px}.compact-report .report-logo{width:42px;height:42px}.compact-report .report-h1{font-size:23px}.compact-report .section-title{margin:6px 0;font-size:14px}.compact-table{border-radius:0;font-size:8px}.compact-table th{background:#fff;color:#e11919!important;border-bottom:2px solid #e11919;font-size:9px;padding:5px 3px}.compact-table th:first-child{width:23%;text-align:left}.compact-table td{padding:3px 4px;height:15px;border-bottom:1px solid #aaa;background:#fff!important}.compact-table .compact-detail td:first-child{padding-left:14px;font-weight:400}.compact-table .compact-main td{font-weight:800}.compact-table td.cell-ok{background:#b5d392!important}.compact-table td.cell-close{background:#ffdc70!important}.compact-table td.cell-bad{background:#ff6060!important;color:#111!important}.compact-table td small{display:block;font-size:6px;font-weight:400}.compact-report .report-footer{text-align:left;font-size:7px;line-height:1.3}.compact-page{break-inside:avoid}.compact-report .seller-page{padding-top:0}
</style>

<header class="topbar"><nav class="nav"></nav></header>
<main class="export-shell">
  <section class="export-hero">
    <div>
      <h1 class="export-title">Rapport Export</h1>
      <div class="export-sub">Managementrapporten voor winkel- en verkopersresultaten</div>
    </div>
    <div class="export-tabs">
      <button id="tabMtd" class="active">Month To Date</button>

<script src="assets/site.js"></script>
<script src="assets/components.js"></script>
<script src="assets/navigation.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<script>
(function(){
'use strict';
const rows=Array.isArray(window.DIESTROYERS_RESULTATEN)?window.DIESTROYERS_RESULTATEN:[];
const sellers=(window.DIESTROYERS_CONFIG_DATA?.verkopers||window.DIESTROYERS_VERKOPERS||[]).filter(v=>active(v.Actief??v.actief??'JA'));
const shop=window.DIESTROYERS_CONFIG_DATA?.shop||{shopNr:'208',naam:'Diest'};
const sales=window.DIESTROYERS_SALES_EXTRA||{};
const days=Array.isArray(window.DIESTROYERS_SALES_DAYS)?window.DIESTROYERS_SALES_DAYS:[];
const money=new Intl.NumberFormat('nl-BE',{style:'currency',currency:'EUR',maximumFractionDigits:0});
const num=new Intl.NumberFormat('nl-BE',{maximumFractionDigits:1});
const months=['Januari','Februari','Maart','April','Mei','Juni','Juli','Augustus','September','Oktober','November','December'];
const KPI=[
 {key:'Life',label:'Life',kind:'count',value:'Life',target:'LifeTarget'},
 {key:'Insurance',label:'Insurance',kind:'ratio',stuks:'InsuranceStuks',kansen:'InsuranceKansen',target:'InsuranceTargetPct'},
 {key:'Abo',label:'Abo',kind:'ratio',stuks:'AboStuks',kansen:'AboKansen',target:'AboTargetPct'},
 {key:'DSP',label:'DSP',kind:'ratio',stuks:'DSPStuks',kansen:'DSPKansen',target:'DSPTargetPct'},
 {key:'SPG',label:'SPG',kind:'ratio',stuks:'SPGStuks',kansen:'SPGKansen',target:'SPGTargetPct'},
 {key:'SRP',label:'SRP',kind:'ratio',stuks:'SRPStuks',kansen:'SRPKansen',target:'SRPTargetPct'},
 {key:'Link',label:'Link',kind:'pct',value:'LinkPct',target:'LinkTargetPct'}
];
let mode='mtd';
function s(v){return String(v??'').trim()}
function n(v){const x=Number(String(v??'').replace(',','.'));return Number.isFinite(x)?x:0}
function active(v){return !['nee','no','0','false','n','inactief'].includes(s(v).toLowerCase())}
function esc(v){return s(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function latestPeriod(){return rows.map(r=>s(r.Periode||r.periode)).filter(Boolean).sort().at(-1)||sales.periode||new Date().toISOString().slice(0,7)}
const period=latestPeriod(), periodYear=period.slice(0,4), monthIndex=Number(period.slice(5,7))-1;
const calendarPeriod=new Intl.DateTimeFormat('sv-SE',{timeZone:'Europe/Brussels',year:'numeric',month:'2-digit'}).format(new Date());
const year=calendarPeriod.slice(0,4), closedMonths=months.slice(0,Number(calendarPeriod.slice(5,7))-1);
const ytdLabel=closedMonths.length?`Januari–${closedMonths.at(-1).toLowerCase()} ${year} · excl. huidige maand`:`${year} · nog geen afgeronde maanden`;
function inYtd(r){const p=s(r.Periode||r.periode);return /^\d{4}-\d{2}$/.test(p)&&p.slice(0,4)===year&&p<calendarPeriod;}
function ytdRecords(type,id){return closedMonths.map((_,i)=>rowFor(type,id,monthPeriod(i))).filter(Boolean);}
function rowFor(type,id,p){return rows.find(r=>s(r.Periode||r.periode)===p&&s(r.EntiteitType||r.entiteitType).toLowerCase()===type.toLowerCase()&&(type==='Winkel'||s(r.PersoneelsNr||r.personeelsNr)===s(id)))||null}
function sellerId(v){return s(v.PersoneelsNr??v.personeelsNr??v.id)}
function sellerName(v){return s(v.Naam??v.naam)||sellerId(v)}
function pct(stuks,kansen){return window.Diestroyers.calculations.servicePercentage(stuks,kansen)}
function metric(r,k,context='month'){
 if(!r)return {display:'—',sub:'',status:'empty',raw:null,target:null,stuks:0,kansen:0};
 let raw,target,sub='';
 if(k.kind==='count'){raw=n(r[k.value]);target=n(r[k.target]);sub=`Target ${num.format(target)}`;}
 else if(k.kind==='ratio'){const st=n(r[k.stuks]),ka=n(r[k.kansen]);raw=pct(st,ka);target=n(r[k.target]);sub=`${num.format(st)} / ${num.format(ka)} · T ${num.format(target)}%`;}
 else {raw=n(r[k.value]);target=n(r[k.target]);sub=`Target ${num.format(target)}%`;}
 if(k.key==='Life'&&context==='seller-ytd')target=50;
 const ratio=target>0?raw/target:0;
 return {display:k.kind==='count'?num.format(raw):num.format(raw)+'%',sub,status:ratio>=1?'ok':ratio>=.9?'close':'bad',raw,target,
  stuks:k.kind==='ratio'?n(r[k.stuks]):raw,kansen:k.kind==='ratio'?n(r[k.kansen]):0};
}
function aggregate(records,isSeller){
 const out={Omzet:0};
 KPI.forEach(k=>{out[k.key]={raw:0,stuks:0,kansen:0,target:0,has:false}});
 records.filter(Boolean).forEach(r=>{
  out.Omzet+=n(r.Omzet);
  KPI.forEach(k=>{
   const x=out[k.key];x.has=true;
   if(k.kind==='count'){x.raw+=n(r[k.value]);x.target+=n(r[k.target]);}
   else if(k.kind==='ratio'){x.stuks+=n(r[k.stuks]);x.kansen+=n(r[k.kansen]);x.target=n(r[k.target])||x.target;}
   else {x.raw+=n(r[k.value]);x.target=n(r[k.target])||x.target;}
  });
 });
 KPI.forEach(k=>{
  const x=out[k.key];
  if(k.kind==='ratio')x.raw=pct(x.stuks,x.kansen);
  if(k.kind==='pct'&&records.filter(Boolean).length)x.raw=x.raw/records.filter(Boolean).length;
  if(k.key==='Life'&&isSeller)x.target=50;
  const ratio=x.target?x.raw/x.target:0;x.status=!x.has?'empty':ratio>=1?'ok':ratio>=.9?'close':'bad';
  x.display=!x.has?'—':(k.kind==='count'?num.format(x.raw):num.format(x.raw)+'%');
  x.sub=!x.has?'':(k.kind==='ratio'?`${num.format(x.stuks)} / ${num.format(x.kansen)} · T ${num.format(x.target)}%`:`Target ${num.format(x.target)}${k.kind==='pct'?'%':''}`);
 });
 return out;
}
function cls(x){return 'cell-'+(x?.status||'empty')}
function kpiCell(x){return `<td class="${cls(x)}"><span class="kpi-main">${esc(x.display)}</span><span class="kpi-sub">${esc(x.sub)}</span></td>`}
function header(title,subtitle){return `<div class="report-header"><div class="report-brand"><div class="report-logo"><img src="assets/diest.png" alt="Diestroyers"></div><div><div class="report-h1">${esc(title)}</div><div style="font-size:12px;color:#666;font-weight:800">${esc(subtitle)}</div></div></div><div class="report-meta"><strong>${esc(shop.naam)} · Shop ${esc(shop.shopNr)}</strong><br>Export: ${new Date().toLocaleString('nl-BE')}</div></div>`}
function tableHead(first,includeOmzet=true){return `<thead><tr><th>${first}</th>${includeOmzet?'<th>Omzet</th>':''}${KPI.map(k=>`<th>${k.label}</th>`).join('')}</tr></thead>`}
function renderMTD(){
 const store=rowFor('Winkel','',period);
 const sellerRows=sellers.slice().sort((a,b)=>Number(sellerId(a))-Number(sellerId(b))).map(v=>({v,r:rowFor('Verkoper',sellerId(v),period)}));
 const omzet=store?n(store.Omzet):n(sales.omzetMaand);
 const klant=n(sales.klantenMaand), conc=n(sales.concretisatieMaand);
 return `<div class="report" id="activeReport">${header('Month To Date',`${months[monthIndex]} ${periodYear}`)}
 <div class="summary-grid"><div class="summary-card"><span>Omzet MTD</span><strong>${money.format(omzet)}</strong></div><div class="summary-card"><span>Klanten MTD</span><strong>${num.format(klant)}</strong></div><div class="summary-card"><span>Concretisatie MTD</span><strong>${num.format(conc)}%</strong></div></div>
 <div class="section-title">Winkelresultaten</div><table class="report-table">${tableHead('Winkel',false)}<tbody><tr><td class="left">${esc(shop.naam)}</td>${KPI.map(k=>kpiCell(metric(store,k))).join('')}</tr></tbody></table>
 <div class="section-title">Verkopersresultaten</div><table class="report-table">${tableHead('Personeelsnr. / Verkoper')}<tbody>${sellerRows.map(({v,r})=>`<tr><td class="left">${esc(sellerId(v))} · ${esc(sellerName(v))}</td><td>${r?money.format(n(r.Omzet)):'—'}</td>${KPI.map(k=>kpiCell(metric(r,k))).join('')}</tr>`).join('')}</tbody></table>
 <div class="report-footer">The Diestroyers · Groen = target behaald · Geel = binnen 10% · Rood = meer dan 10% onder target</div></div>`;
}
function monthPeriod(i){return `${year}-${String(i+1).padStart(2,'0')}`}
function salesMonthData(i){
 const p=monthPeriod(i);
 if(p===period)return {customers:n(sales.klantenMaand),conc:n(sales.concretisatieMaand),has:true};
 return {customers:null,conc:null,has:false};
}
function renderYTD(){
 if(!closedMonths.length)return `<div class="report" id="activeReport">${header('Year To Date',ytdLabel)}<p>Er zijn nog geen afgeronde maanden in het huidige jaar.</p></div>`;
 const storeMonthly=closedMonths.map((m,i)=>({m,p:monthPeriod(i),r:rowFor('Winkel','',monthPeriod(i)),sales:salesMonthData(i)}));
 const storeAgg=aggregate(storeMonthly.filter(x=>x.r).map(x=>x.r),false);
 const currentSales=storeMonthly.filter(x=>x.sales.has);
 const custYtd=currentSales.reduce((a,x)=>a+n(x.sales.customers),0);
 const concYtd=currentSales.length?currentSales.reduce((a,x)=>a+n(x.sales.conc),0)/currentSales.length:null;
 const storeRows=storeMonthly.map(x=>`<tr><td class="left">${x.m}</td><td>${x.r?money.format(n(x.r.Omzet)):'—'}</td><td>${x.sales.has?num.format(x.sales.customers):'—'}</td><td>${x.sales.has?num.format(x.sales.conc)+'%':'—'}</td>${KPI.map(k=>kpiCell(metric(x.r,k))).join('')}</tr>`).join('');

   styleSheet(ws);
   ws.getColumn(2).numFmt='€ #,##0';ws.getColumn(3).numFmt='#,##0';ws.getColumn(4).numFmt='0.0%';
   const sv=wb.addWorksheet('MTD Verkopers');sv.addRow([`The Diestroyers · ${shop.naam} · MTD ${period}`]);sv.mergeCells(1,1,1,10);sv.addRow(['Personeelsnr.','Verkoper','Omzet',...KPI.map(k=>k.label)]);
   sellers.slice().sort((a,b)=>Number(sellerId(a))-Number(sellerId(b))).forEach(v=>{const r=rowFor('Verkoper',sellerId(v),period);sv.addRow([sellerId(v),sellerName(v),r?n(r.Omzet):'—',...KPI.map(k=>excelCell(metric(r,k)))])});styleSheet(sv);sv.getColumn(3).numFmt='€ #,##0';
  }else if(mode==='compact'){
   addCompactWorkbook(wb);
  }else{
   const wm=wb.addWorksheet('Winkel per maand');wm.addRow([`The Diestroyers · ${shop.naam} · Shop ${shop.shopNr} · YTD ${ytdLabel}`]);wm.mergeCells(1,1,1,12);wm.addRow(['Maand','Omzet','Klanten','Concretisatie',...KPI.map(k=>k.label)]);
   closedMonths.forEach((m,i)=>{const r=rowFor('Winkel','',monthPeriod(i)),sd=salesMonthData(i);wm.addRow([m,r?n(r.Omzet):'—',sd.has?sd.customers:'—',sd.has?sd.conc/100:'—',...KPI.map(k=>excelCell(metric(r,k)))])});styleSheet(wm);wm.getColumn(2).numFmt='€ #,##0';
   const vy=wb.addWorksheet('Verkopers YTD');vy.addRow([`The Diestroyers · ${shop.naam} · Verkopers YTD ${ytdLabel}`]);vy.mergeCells(1,1,1,10);vy.addRow(['Personeelsnr.','Verkoper','Omzet',...KPI.map(k=>k.label)]);
   sellers.slice().sort((a,b)=>Number(sellerId(a))-Number(sellerId(b))).forEach(v=>{const rec=closedMonths.map((_,i)=>rowFor('Verkoper',sellerId(v),monthPeriod(i))).filter(Boolean),a=aggregate(rec,true);vy.addRow([sellerId(v),sellerName(v),a.Omzet,...KPI.map(k=>excelCell(a[k.key]))])});styleSheet(vy);vy.getColumn(3).numFmt='€ #,##0';
   const vm=wb.addWorksheet('Verkopers per maand');vm.addRow([`The Diestroyers · ${shop.naam} · Verkopers per maand ${ytdLabel}`]);vm.mergeCells(1,1,1,11);vm.addRow(['Personeelsnr.','Verkoper','Maand','Omzet',...KPI.map(k=>k.label)]);
   sellers.slice().sort((a,b)=>Number(sellerId(a))-Number(sellerId(b))).forEach(v=>closedMonths.forEach((m,i)=>{const r=rowFor('Verkoper',sellerId(v),monthPeriod(i));vm.addRow([sellerId(v),sellerName(v),m,r?n(r.Omzet):'—',...KPI.map(k=>excelCell(metric(r,k)))])}));styleSheet(vm);vm.getColumn(4).numFmt='€ #,##0';
  }
  finishWorkbookStyling(wb);
  if(mode==='compact')wb.eachSheet(ws=>{ws.eachRow((row,ri)=>{if(ri>2){row.height=ri>=ws.rowCount-1?46:18;row.eachCell((cell,ci)=>{cell.alignment={vertical:'middle',horizontal:ci===1?'left':'center',wrapText:true};cell.font={...(cell.font||{}),size:9};});}});});
  const buffer=await withTimeout(wb.xlsx.writeBuffer(),90000,'De Excel-export');
  const blob=new Blob([buffer],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  downloadBlob(blob,filename('xlsx'));
 }catch(err){
  showExportError(err);
 }finally{mask(false)}
}
function mask(on){document.getElementById('loadingMask').classList.toggle('show',on)}
function selectMode(next){mode=next;for(const [id,value] of [['tabMtd','mtd'],['tabYtd','ytd'],['tabCompact','compact']])document.getElementById(id).classList.toggle('active',mode===value);render();}
document.getElementById('tabMtd').onclick=()=>selectMode('mtd');
document.getElementById('tabYtd').onclick=()=>selectMode('ytd');
document.getElementById('tabCompact').onclick=()=>selectMode('compact');
document.getElementById('pdfBtn').onclick=pdf;
document.getElementById('xlsxBtn').onclick=downloadWorkbook;
document.getElementById('tvPdfBtn').onclick=()=>{const win=window.open('tv.html?export=slides2to13&autostart=1','_blank');if(!win)showExportError(new Error('De browser blokkeerde het exportvenster. Sta pop-ups toe voor deze pagina.'));};
render();
})();
</script>
</body></html>
