.report{padding:18mm 14mm 14mm;background:#fff;min-height:190mm}

.summary-card{border:1px solid #d5d5d5;border-radius:10px;padding:9px 11px;background:#fafafa;color:#111}

.report-table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:9px}

.report-table tr:nth-child(even) td{background:#f5f5f5}
.kpi-main{display:block;font-size:10px;font-weight:900}
.kpi-sub{display:block;font-size:7.5px;color:#555;margin-top:2px;white-space:nowrap}
.cell-ok{background:#dff6e8!important;color:#0d5f31!important}

<script>
(function(){
'use strict';
const rows=Array.isArray(window.DIESTROYERS_RESULTATEN)?window.DIESTROYERS_RESULTATEN:[];
const sellers=(window.DIESTROYERS_CONFIG_DATA?.verkopers||window.DIESTROYERS_VERKOPERS||[]).filter(v=>active(v.Actief??v.actief??'JA'));
const shop=window.DIESTROYERS_CONFIG_DATA?.shop||{shopNr:'208',naam:'Diest'};
const sales=window.DIESTROYERS_SALES_EXTRA||{};
const days=Array.isArray(window.DIESTROYERS_SALES_DAYS)?window.DIESTROYERS_SALES_DAYS:[];
const money=new Intl.NumberFormat('nl-BE',{style:'currency',currency:'EUR',maximumFractionDigits:0});
const num=new Intl.NumberFormat('nl-BE',{maximumFractionDigits:1});
const viewNumber=new Intl.NumberFormat('nl-BE',{maximumFractionDigits:2});
const months=['Januari','Februari','Maart','April','Mei','Juni','Juli','Augustus','September','Oktober','November','December'];
const KPI=[
 {key:'Life',label:'Life',kind:'count',value:'Life',target:'LifeTarget'},
 {key:'Insurance',label:'Insurance',kind:'ratio',stuks:'InsuranceStuks',kansen:'InsuranceKansen',target:'InsuranceTargetPct'},
 {key:'Abo',label:'Abo',kind:'ratio',stuks:'AboStuks',kansen:'AboKansen',target:'AboTargetPct'},
 {key:'DSP',label:'DSP',kind:'ratio',stuks:'DSPStuks',kansen:'DSPKansen',target:'DSPTargetPct'},
 {key:'SPG',label:'SPG',kind:'ratio',stuks:'SPGStuks',kansen:'SPGKansen',target:'SPGTargetPct'},
 {key:'SRP',label:'SRP',kind:'ratio',stuks:'SRPStuks',kansen:'SRPKansen',target:'SRPTargetPct'},
 {key:'Link',label:'Link',kind:'pct',value:'LinkPct',target:'LinkTargetPct'}
];
let mode='mtd', viewReport=null;
function s(v){return String(v??'').trim()}
function n(v){const x=Number(String(v??'').replace(',','.'));return Number.isFinite(x)?x:0}
function active(v){return !['nee','no','0','false','n','inactief'].includes(s(v).toLowerCase())}
function esc(v){return s(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function latestPeriod(){return rows.map(r=>s(r.Periode||r.periode)).filter(Boolean).sort().at(-1)||sales.periode||new Date().toISOString().slice(0,7)}
const period=latestPeriod(), periodYear=period.slice(0,4), monthIndex=Number(period.slice(5,7))-1;
const calendarPeriod=new Intl.DateTimeFormat('sv-SE',{timeZone:'Europe/Brussels',year:'numeric',month:'2-digit'}).format(new Date());
const year=calendarPeriod.slice(0,4), closedMonths=months.slice(0,Number(calendarPeriod.slice(5,7))-1);
const ytdLabel=closedMonths.length?`Januari–${closedMonths.at(-1).toLowerCase()} ${year} · excl. huidige maand`:`${year} · nog geen afgeronde maanden`;
function inYtd(r){const p=s(r.Periode||r.periode);return /^\d{4}-\d{2}$/.test(p)&&p.slice(0,4)===year&&p<calendarPeriod;}
function ytdRecords(type,id){return closedMonths.map((_,i)=>rowFor(type,id,monthPeriod(i))).filter(Boolean);}
function rowFor(type,id,p){return rows.find(r=>s(r.Periode||r.periode)===p&&s(r.EntiteitType||r.entiteitType).toLowerCase()===type.toLowerCase()&&(type==='Winkel'||s(r.PersoneelsNr||r.personeelsNr)===s(id)))||null}
function sellerId(v){return s(v.PersoneelsNr??v.personeelsNr??v.id)}
function sellerName(v){return s(v.Naam??v.naam)||sellerId(v)}
function exportEntity(row){
 if(!row)return null;
 return s(row.EntiteitType||row.entiteitType).toLowerCase()==='verkoper'
   ? {type:'Verkoper',id:sellerId(row),name:sellerName(row)}
   : window.ScorebladData.store;
}
function scoreTarget(key,entity,period,annual=false){
 const def=window.Diestroyers.registry.kpiByKey[key];
 return def && entity && period ? (annual?window.ScorebladData.annual:window.ScorebladData.month)(entity,def.id,period) : null;
}
function pct(stuks,kansen){return window.Diestroyers.calculations.servicePercentage(stuks,kansen)}
function metric(r,k){
 if(!r)return {display:'—',sub:'',status:'empty',raw:null,target:null,stuks:0,kansen:0};
 let raw,target,sub='';
 target=scoreTarget(k.key,exportEntity(r),s(r.Periode||r.periode))?.target??null;
 if(k.kind==='count'){raw=n(r[k.value]);sub=target===null?'Geen target':`Target ${num.format(target)}`;}
 else if(k.kind==='ratio'){const st=n(r[k.stuks]),ka=n(r[k.kansen]);raw=pct(st,ka);sub=`${num.format(st)} / ${num.format(ka)} · ${target===null?'Geen target':'T '+num.format(target)+'%'}`;}
 else {raw=n(r[k.value]);sub=target===null?'Geen target':`Target ${num.format(target)}%`;}
 const ratio=target>0?raw/target:0;
 return {display:k.kind==='count'?num.format(raw):num.format(raw)+'%',sub,status:target===null?'':ratio>=1?'ok':ratio>=.9?'close':'bad',raw,target,
  stuks:k.kind==='ratio'?n(r[k.stuks]):raw,kansen:k.kind==='ratio'?n(r[k.kansen]):0};
}
function aggregate(records, entity=exportEntity(records.find(Boolean))){
 const out={Omzet:0};
 KPI.forEach(k=>{out[k.key]={raw:0,stuks:0,kansen:0,target:0,targetMonths:0,has:false}});
 records.filter(Boolean).forEach(r=>{
  out.Omzet+=n(r.Omzet);
  KPI.forEach(k=>{
   const x=out[k.key];x.has=true;
   if(k.kind==='ratio'){x.stuks+=n(r[k.stuks]);x.kansen+=n(r[k.kansen]);}
   else x.raw+=n(r[k.value]);
   const target=n(r[k.target]);
   if(target>0){x.target+=target;x.targetMonths++;}
  });
 });
 KPI.forEach(k=>{
  const x=out[k.key];
  if(k.kind==='ratio')x.raw=pct(x.stuks,x.kansen);
  if(k.kind==='pct'&&records.filter(Boolean).length)x.raw=x.raw/records.filter(Boolean).length;
  if(entity?.type!=='DistrictWinkel' && entity && closedMonths.length){
   x.target=scoreTarget(k.key,entity,monthPeriod(closedMonths.length-1),true)?.target??null;
  }else if(k.kind!=='count'&&x.targetMonths)x.target/=x.targetMonths;
  const ratio=x.target?x.raw/x.target:0;x.status=!x.has?'empty':!x.target?'':ratio>=1?'ok':ratio>=.9?'close':'bad';
  x.display=!x.has?'—':(k.kind==='count'?num.format(x.raw):num.format(x.raw)+'%');
  const label=x.target===null?'Geen target':`${k.kind==='ratio'?'T':'Target'} ${num.format(x.target)}${k.kind==='count'?'':'%'}`;
  x.sub=!x.has?'':(k.kind==='ratio'?`${num.format(x.stuks)} / ${num.format(x.kansen)} · ${label}`:label);
 });
 return out;
}
function cls(x){return 'cell-'+(x?.status||'empty')}
function kpiCell(x){return `<td class="${cls(x)}"><span class="kpi-main">${esc(x.display)}</span><span class="kpi-sub">${esc(x.sub)}</span></td>`}
function header(title,subtitle){return `<div class="report-header"><div class="report-brand"><div class="report-logo"><img src="assets/diest.png" alt="Diestroyers"></div><div><div class="report-h1">${esc(title)}</div><div style="font-size:12px;color:#666;font-weight:800">${esc(subtitle)}</div></div></div><div class="report-meta"><strong>${esc(shop.naam)} · Shop ${esc(shop.shopNr)}</strong><br>Export: ${new Date().toLocaleString('nl-BE')}</div></div>`}
function tableHead(first,includeOmzet=true){return `<thead><tr><th>${first}</th>${includeOmzet?'<th>Omzet</th>':''}${KPI.map(k=>`<th>${k.label}</th>`).join('')}</tr></thead>`}
function renderMTD(){
 const store=rowFor('Winkel','',period);
 const sellerRows=sellers.slice().sort((a,b)=>Number(sellerId(a))-Number(sellerId(b))).map(v=>({v,r:rowFor('Verkoper',sellerId(v),period)}));
 const omzet=store?n(store.Omzet):n(sales.omzetMaand);
 const klant=n(sales.klantenMaand), conc=n(sales.concretisatieMaand);
 return `<div class="report" id="activeReport">${header('Month To Date',`${months[monthIndex]} ${periodYear}`)}
 <div class="summary-grid"><div class="summary-card"><span>Omzet MTD</span><strong>${money.format(omzet)}</strong></div><div class="summary-card"><span>Klanten MTD</span><strong>${num.format(klant)}</strong></div><div class="summary-card"><span>Concretisatie MTD</span><strong>${num.format(conc)}%</strong></div></div>
 <div class="section-title">Winkelresultaten</div><table class="report-table">${tableHead('Winkel',false)}<tbody><tr><td class="left">${esc(shop.naam)}</td>${KPI.map(k=>kpiCell(metric(store,k))).join('')}</tr></tbody></table>
 <div class="section-title">Verkopersresultaten</div><table class="report-table">${tableHead('Personeelsnr. / Verkoper')}<tbody>${sellerRows.map(({v,r})=>`<tr><td class="left">${esc(sellerId(v))} · ${esc(sellerName(v))}</td><td>${r?money.format(n(r.Omzet)):'—'}</td>${KPI.map(k=>kpiCell(metric(r,k))).join('')}</tr>`).join('')}</tbody></table>
 <div class="report-footer">The Diestroyers · Groen = target behaald · Geel = binnen 10% · Rood = meer dan 10% onder target</div></div>`;
}
function monthPeriod(i){return `${year}-${String(i+1).padStart(2,'0')}`}
function salesMonthData(i){
 const p=monthPeriod(i);
 if(p===period)return {customers:n(sales.klantenMaand),conc:n(sales.concretisatieMaand),has:true};
 return {customers:null,conc:null,has:false};
}
function renderYTD(){
 if(!closedMonths.length)return `<div class="report" id="activeReport">${header('Year To Date',ytdLabel)}<p>Er zijn nog geen afgeronde maanden in het huidige jaar.</p></div>`;
 const storeMonthly=closedMonths.map((m,i)=>({m,p:monthPeriod(i),r:rowFor('Winkel','',monthPeriod(i)),sales:salesMonthData(i)}));
 const storeAgg=aggregate(storeMonthly.filter(x=>x.r).map(x=>x.r));
 const currentSales=storeMonthly.filter(x=>x.sales.has);
 const custYtd=currentSales.reduce((a,x)=>a+n(x.sales.customers),0);
 const concYtd=currentSales.length?currentSales.reduce((a,x)=>a+n(x.sales.conc),0)/currentSales.length:null;
 const storeRows=storeMonthly.map(x=>`<tr><td class="left">${x.m}</td><td>${x.r?money.format(n(x.r.Omzet)):'—'}</td><td>${x.sales.has?num.format(x.sales.customers):'—'}</td><td>${x.sales.has?num.format(x.sales.conc)+'%':'—'}</td>${KPI.map(k=>kpiCell(metric(x.r,k))).join('')}</tr>`).join('');

 const min=Math.min(...values),max=Math.max(...values);

 ctx.fillStyle='#202124';ctx.font='bold 25px Arial';ctx.fillText(chart.title,22,35);
 ctx.font='20px Arial';ctx.fillStyle='#555';ctx.fillText(chart.unit+' · Resultaat',22,64);
 if(history.some(item=>valid(item.metric?.target)))ctx.fillText('– – Target',190,64);

 for(const fraction of [0,1/3,2/3,1]){
  const value=low+(high-low)*fraction, height=y(value);
  ctx.strokeStyle='#ddd';ctx.beginPath();ctx.moveTo(90,height);ctx.lineTo(960,height);ctx.stroke();
  ctx.fillText(num.format(value),12,height+6);

   ctx[method](x(index),y(metric[key]));

   if(valid(metric?.value)){ctx.beginPath();ctx.arc(x(index),y(metric.value),4.5,0,Math.PI*2);ctx.fill();}
  });

  const lines=values=>values.map((value,index)=>doc.splitTextToSize(text(value),widths[index]-3));
  function write(cells,header=false){
   const height=Math.max(...cells.map(cell=>cell.length))*3.7+2.2;
   doc.setFont('helvetica',header?'bold':'normal');doc.setFontSize(8);
   if(header){doc.setFillColor(155,18,34);doc.rect(10,y,277,height,'F');doc.setTextColor(255,255,255);}
   else{doc.setDrawColor(224,218,209);doc.line(10,y+height,287,y+height);doc.setTextColor(25,25,25);}
   cells.forEach((cell,index)=>doc.text(cell,positions[index]+1.5,y+3.5));
   y+=height;
  }
  function startTable(){
   doc.setTextColor(25,25,25);doc.setFont('helvetica','bold');doc.setFontSize(11);
   doc.text(text(table.title),10,y+4);y+=6;
   doc.setFontSize(8);
   write(lines(table.headers),true);
  }
  if(y>176)page();
  startTable();
  for(const row of table.rows){
   doc.setFont('helvetica','normal');doc.setFontSize(8);
   const cells=lines(row);
   if(y+Math.max(...cells.map(cell=>cell.length))*3.7+2.2>196){page();startTable();}
   write(cells);
  }
  y+=7;
 }
 downloadBlob(doc.output('blob'),filename('pdf'));
}
async function pdf(){
 if(mode==='view'){
  mask(true);
  try{viewPdf();}catch(err){showExportError(err);}finally{mask(false);}
  return;
 }
  if(mode==='compact')return compactPdf();
 const el=document.getElementById('activeReport');
 if(!el)return;
 if(typeof html2pdf==='undefined'){
   showExportError(new Error('De PDF-bibliotheek kon niet worden geladen. Controleer de internetverbinding.'));
   return;
 }
 mask(true);
 try{
   await waitForReportAssets(el);
   const options={
     margin:0,
     image:{type:'jpeg',quality:.96},
     html2canvas:{scale:1.6,useCORS:true,allowTaint:false,backgroundColor:'#ffffff',logging:false,letterRendering:true,removeContainer:true},
     jsPDF:{unit:'mm',format:'a4',orientation:'landscape',compress:true},
     pagebreak:{mode:['css','legacy'],before:'.seller-page'}
   };
   const worker=html2pdf().set(options).from(el).toPdf();
   const blob=await withTimeout(worker.outputPdf('blob'),90000,'De PDF-export');
   downloadBlob(blob,filename('pdf'));
 }catch(err){
   showExportError(err);
 }finally{
   mask(false);
 }
}
function excelCell(metric){return metric?.display==='—'?'—':`${metric.display}${metric.sub?' | '+metric.sub:''}`}
function styleSheet(ws,title){
 ws.views=[{state:'frozen',ySplit:2,xSplit:1}];
 ws.properties.defaultRowHeight=20;
 ws.getRow(1).height=32;
 ws.getRow(1).eachCell(c=>{
   c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF151515'}};
   c.font={color:{argb:'FFFFFFFF'},bold:true,size:15,name:'Arial'};
   c.alignment={vertical:'middle',horizontal:'left'};
 });
 ws.getRow(2).height=26;
 ws.getRow(2).eachCell(c=>{
   c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFE11919'}};
   c.font={color:{argb:'FFFFFFFF'},bold:true,size:10,name:'Arial'};
   c.alignment={vertical:'middle',horizontal:'center',wrapText:true};
   c.border={bottom:{style:'medium',color:{argb:'FF751010'}},right:{style:'thin',color:{argb:'FFF07A7A'}}};
 });
 ws.columns.forEach((col,i)=>col.width=i===0?28:(i===1?22:18));
 ws.autoFilter={from:{row:2,column:1},to:{row:2,column:ws.columnCount}};
 ws.pageSetup={orientation:'landscape',paperSize:9,fitToPage:true,fitToWidth:1,fitToHeight:0,margins:{left:.25,right:.25,top:.45,bottom:.45,header:.15,footer:.15}};
 ws.headerFooter.oddHeader=`&L&BThe Diestroyers&C${shop.naam} · Shop ${shop.shopNr}&R${mode.toUpperCase()} ${mode==='mtd'?period:year}`;
 ws.headerFooter.oddFooter='&LInterne managementrapportering&C&P / &N&R&D &T';
 ws.printTitlesRow='1:2';
}
function excelStatusStyle(cell,value){
 const v=String(value??'');
 cell.font={color:{argb:'FF111111'},size:10,name:'Arial'};
 if(v==='—'){
   cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFEDEDED'}};
   cell.font={color:{argb:'FF777777'},size:10,name:'Arial'};
   return;
 }
 const m=v.match(/Target\s+([0-9.,]+)/i)||v.match(/·\s*T\s*([0-9.,]+)/i);
 const actual=parseFloat((v.match(/^([0-9.,]+)/)||[])[1]?.replace(',','.')||'NaN');
 const target=parseFloat((m||[])[1]?.replace(',','.')||'NaN');
 if(Number.isFinite(actual)&&Number.isFinite(target)&&target>0){
   const ratio=actual/target;
   const fill=ratio>=1?'FFDFF3E6':ratio>=.9?'FFFFF1C7':'FFF9DDDD';
   const color=ratio>=1?'FF0B5A2B':ratio>=.9?'FF665000':'FF741515';
   cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:fill}};
   cell.font={color:{argb:color},bold:true,size:10,name:'Arial'};
 }
}
function finishWorkbookStyling(wb){
 wb.eachSheet(ws=>{
   ws.eachRow((row,ri)=>{
     if(ri<=2)return;
     row.height=24;
     row.eachCell((c,ci)=>{
       c.alignment={vertical:'middle',horizontal:ci<=2?'left':'center',wrapText:true};
       c.border={bottom:{style:'hair',color:{argb:'FFD0D0D0'}},right:{style:'hair',color:{argb:'FFE0E0E0'}}};
       if(ri%2===0&&!c.fill?.fgColor)c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFF7F7F7'}};
       if(ci>=4||String(c.value??'').includes('Target')||String(c.value??'').includes('· T'))excelStatusStyle(c,c.value);
       else c.font={color:{argb:'FF111111'},size:10,name:'Arial',bold:ci<=2};
     });
   });
 });
}
async function downloadWorkbook(){
 if(typeof ExcelJS==='undefined'){showExportError(new Error('De Excel-bibliotheek kon niet worden geladen. Controleer de internetverbinding.'));return;}
 mask(true);
 try{
  const wb=new ExcelJS.Workbook();wb.creator='The Diestroyers';wb.created=new Date();
  if(mode==='view'){
   viewReport.tables.forEach((table,index)=>{
    const ws=wb.addWorksheet(`${index+1}. ${table.title}`.replace(/[\\/?:*\[\]]/g,' ').slice(0,31));
    ws.addRow([viewReport.title+' · '+viewReport.period+' · '+table.title]);
    ws.mergeCells(1,1,1,table.headers.length);
    ws.addRow(table.headers);
    table.rows.forEach(values=>ws.addRow(values));
    styleSheet(ws);
    ws.columns.forEach((column,i)=>{column.width=i===0?28:Math.max(16,table.headers[i].length+2);});
   });
   if(viewReport.charts.length){
    const charts=wb.addWorksheet('Maandgrafieken');
    charts.addRow([viewReport.title+' · '+viewReport.period]);
    charts.getRow(1).font={bold:true};
    viewReport.charts.forEach((chart,index)=>{
     const image=wb.addImage({base64:viewChart(chart).toDataURL('image/png'),extension:'png'});
     charts.addImage(image,{tl:{col:0,row:index*17+1},ext:{width:700,height:231}});
    });
   }
  }else if(mode==='mtd'){
   const store=rowFor('Winkel','',period);
   const ws=wb.addWorksheet('MTD Winkel');
   ws.addRow([`The Diestroyers · ${shop.naam} · Shop ${shop.shopNr} · MTD ${period}`]);
   ws.mergeCells(1,1,1,11);
   ws.addRow(['Winkel','Omzet','Klanten','Concretisatie',...KPI.map(k=>k.label)]);
   ws.addRow([shop.naam,n(store?.Omzet)||n(sales.omzetMaand),n(sales.klantenMaand),n(sales.concretisatieMaand)/100,...KPI.map(k=>excelCell(metric(store,k)))]);
   styleSheet(ws);
   ws.getColumn(2).numFmt='€ #,##0';ws.getColumn(3).numFmt='#,##0';ws.getColumn(4).numFmt='0.0%';
   const sv=wb.addWorksheet('MTD Verkopers');sv.addRow([`The Diestroyers · ${shop.naam} · MTD ${period}`]);sv.mergeCells(1,1,1,10);sv.addRow(['Personeelsnr.','Verkoper','Omzet',...KPI.map(k=>k.label)]);
   sellers.slice().sort((a,b)=>Number(sellerId(a))-Number(sellerId(b))).forEach(v=>{const r=rowFor('Verkoper',sellerId(v),period);sv.addRow([sellerId(v),sellerName(v),r?n(r.Omzet):'—',...KPI.map(k=>excelCell(metric(r,k)))])});styleSheet(sv);sv.getColumn(3).numFmt='€ #,##0';
  }else if(mode==='compact'){
   addCompactWorkbook(wb);
  }else{
   const wm=wb.addWorksheet('Winkel per maand');wm.addRow([`The Diestroyers · ${shop.naam} · Shop ${shop.shopNr} · YTD ${ytdLabel}`]);wm.mergeCells(1,1,1,12);wm.addRow(['Maand','Omzet','Klanten','Concretisatie',...KPI.map(k=>k.label)]);
   closedMonths.forEach((m,i)=>{const r=rowFor('Winkel','',monthPeriod(i)),sd=salesMonthData(i);wm.addRow([m,r?n(r.Omzet):'—',sd.has?sd.customers:'—',sd.has?sd.conc/100:'—',...KPI.map(k=>excelCell(metric(r,k)))])});styleSheet(wm);wm.getColumn(2).numFmt='€ #,##0';
   const vy=wb.addWorksheet('Verkopers YTD');vy.addRow([`The Diestroyers · ${shop.naam} · Verkopers YTD ${ytdLabel}`]);vy.mergeCells(1,1,1,10);vy.addRow(['Personeelsnr.','Verkoper','Omzet',...KPI.map(k=>k.label)]);
   sellers.slice().sort((a,b)=>Number(sellerId(a))-Number(sellerId(b))).forEach(v=>{const rec=closedMonths.map((_,i)=>rowFor('Verkoper',sellerId(v),monthPeriod(i))).filter(Boolean),a=aggregate(rec);vy.addRow([sellerId(v),sellerName(v),a.Omzet,...KPI.map(k=>excelCell(a[k.key]))])});styleSheet(vy);vy.getColumn(3).numFmt='€ #,##0';
   const vm=wb.addWorksheet('Verkopers per maand');vm.addRow([`The Diestroyers · ${shop.naam} · Verkopers per maand ${ytdLabel}`]);vm.mergeCells(1,1,1,11);vm.addRow(['Personeelsnr.','Verkoper','Maand','Omzet',...KPI.map(k=>k.label)]);
   sellers.slice().sort((a,b)=>Number(sellerId(a))-Number(sellerId(b))).forEach(v=>closedMonths.forEach((m,i)=>{const r=rowFor('Verkoper',sellerId(v),monthPeriod(i));vm.addRow([sellerId(v),sellerName(v),m,r?n(r.Omzet):'—',...KPI.map(k=>excelCell(metric(r,k)))])}));styleSheet(vm);vm.getColumn(4).numFmt='€ #,##0';
  }
  finishWorkbookStyling(wb);
  if(mode==='compact')wb.eachSheet(ws=>{ws.eachRow((row,ri)=>{if(ri>2){row.height=ri>=ws.rowCount-1?46:18;row.eachCell((cell,ci)=>{cell.alignment={vertical:'middle',horizontal:ci===1?'left':'center',wrapText:true};cell.font={...(cell.font||{}),size:9};});}});});
  const buffer=await withTimeout(wb.xlsx.writeBuffer(),90000,'De Excel-export');
  const blob=new Blob([buffer],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  downloadBlob(blob,filename('xlsx'));
 }catch(err){
  showExportError(err);
 }finally{mask(false)}
}

 mode=next;
 for(const [id,value] of [['tabView','view'],['tabMtd','mtd'],['tabYtd','ytd'],['tabCompact','compact']]){
   document.getElementById(id).setAttribute('aria-pressed',String(mode===value));

 render();
}
