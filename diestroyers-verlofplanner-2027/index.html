function renderNav(){const menu=navs.map(([v,t])=>`<button class="${state.view===v?'active':''}" data-nav="${v}">${t}</button>`).join('');$('nav').innerHTML=menu;$('mobileNav').innerHTML=menu;document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>navTo(b.dataset.nav))}
function render(){renderNav();const titles={calendar:'Verlofkalender',apply:'Verlof aanvragen',mine:'Mijn verlof',admin:'Beheer'};$('pageTitle').textContent=titles[state.view];$('sectionTag').textContent=state.view==='admin'?'MANAGEMENT · 2027':'TEAMPLANNING · 2027';$('view').innerHTML=({calendar:renderCalendar,apply:renderApply,mine:renderMine,admin:renderAdmin})[state.view]();bind()}
function dayCell(d,mini=false){const list=active(d),max=rule(d),n=list.length,cls=max===0?'zero':n>max?'over':n===max?'full':'ok',special=holiday(d)||periods(d).length;return mini?`<span class="${max===0||n>max?'red':n===max?'orange':'green'}" title="${esc(d)}: ${n}/${max}"></span>`:`<button class="day ${cls} ${state.selected===d?'sel':''}" data-date="${d}" title="${esc(dateFmt(d))}: ${n}/${max}"><b>${Number(d.slice(-2))}</b>${special?'<span class="dot"></span>':''}<span class="count">${n} / ${max}</span><span class="mark"></span></button>`}
function monthGrid(m){const first=(new Date(Date.UTC(2027,m,1)).getUTCDay()+6)%7,total=new Date(Date.UTC(2027,m+1,0)).getUTCDate();return `<div class="week">${['MA','DI','WO','DO','VR','ZA','ZO'].map(x=>`<span>${x}</span>`).join('')}</div><div class="days">${'<span class="day blank"></span>'.repeat(first)}${Array.from({length:total},(_,i)=>dayCell(dateString(m,i+1))).join('')}</div>`}
function renderCalendar(){let left;if(state.yearMode){left=`<div class="year">${monthNames.map((name,m)=>{const total=new Date(Date.UTC(2027,m+1,0)).getUTCDate(),first=(new Date(Date.UTC(2027,m,1)).getUTCDay()+6)%7;return `<div class="mini" data-month="${m}"><h3>${name} ↗</h3><div class="mini-grid">${'<span class="off"></span>'.repeat(first)}${Array.from({length:total},(_,i)=>dayCell(dateString(m,i+1),true)).join('')}</div></div>`}).join('')}</div>`}else left=`<div class="row between" style="margin-bottom:15px"><div class="row"><button id="prevMonth" ${state.month===0?'disabled':''}>←</button><strong>${monthNames[state.month]} 2027</strong><button id="nextMonth" ${state.month===11?'disabled':''}>→</button></div></div>${monthGrid(state.month)}`;
const d=state.selected,req=active(d),p=periods(d),h=holiday(d);return `<div class="grid"><section><div class="card"><div class="row between" style="margin-bottom:16px"><h2 style="margin:0">Planning 2027</h2><div class="tabs"><button id="yearToggle" class="${state.yearMode?'on':''}">Jaar</button><button id="monthToggle" class="${!state.yearMode?'on':''}">Maand</button></div></div>${left}<div class="legend"><span><i style="background:#42c994"></i>Ruimte</span><span><i style="background:#efb858"></i>Maximum bereikt</span><span><i style="background:#ed344d"></i>Beperking / overschrijding</span><span><i style="background:#77a9e5"></i>Bijzonderheid</span></div></div></section><aside><div class="card"><div class="eyebrow">GESELECTEERDE DAG</div><h2>${dateFmt(d)}</h2><div class="stats"><div class="stat"><strong>${req.length}</strong><span>Aanvragen</span></div><div class="stat"><strong>${rule(d)}</strong><span>Richtmaximum</span></div><div class="stat"><strong>${req.filter(r=>r.status==='approved').length}</strong><span>Goedgekeurd</span></div></div>${req.length?req.map(r=>`<div class="item"><b>${esc(r.name)}</b>${statusBadge(r.status)}</div>`).join(''):'<p class="muted">Nog geen aanvragen voor deze dag.</p>'}${h?`<div class="notice">Feestdag: ${esc(h.title)}</div>`:''}${p.map(x=>`<div class="notice">${esc(x.kind)}: ${esc(x.title)}</div>`).join('')}<hr><button class="primary fullwidth" id="applySelected">＋ Deze dag aanvragen</button></div><div class="card"><h2>Hoe werkt het?</h2><p class="muted">De bezettingsmaxima zijn richtlijnen. Je kunt altijd verlof aanvragen, ook wanneer een dag volzet is. Een beheerder beslist over goedkeuring.</p></div></aside></div>`}
function renderApply(){const emp=state.employees.find(e=>e.number===state.number);return `<div class="grid"><div class="card"><h2>Nieuwe aanvraag</h2><p class="muted">Selecteer één dag of een periode. Je aanvraag wordt meteen opgeslagen en krijgt de status <b>In behandeling</b>.</p><form id="applyForm"><label for="number">Personeelsnummer</label><input id="number" inputmode="numeric" autocomplete="off" required value="${esc(state.number)}" placeholder="Jouw personeelsnummer"><div class="formgrid"><div><label for="start">Van</label><input type="date" id="start" required min="2027-01-01" max="2027-12-31" value="${esc(state.selected)}"></div><div><label for="end">Tot en met</label><input type="date" id="end" required min="2027-01-01" max="2027-12-31" value="${esc(state.selected)}"></div></div><div id="applyPreview" class="notice"></div><button type="submit" class="primary fullwidth">Aanvraag indienen</button></form></div><aside><div class="card"><h2>Goed om te weten</h2><p class="muted">Zondagen, officiële Belgische feestdagen en jouw vaste vrije dag kosten geen verlofsaldo. Alle geselecteerde dagen blijven zichtbaar in de planning.</p>${emp?`<div class="stat"><strong>${emp.allowance-emp.charged-emp.pending}</strong><span>Verwacht beschikbaar na lopende aanvragen</span></div>`:''}</div></aside></div>`}
function renderMine(){return `<div class="grid"><div class="card"><h2>Mijn aanvragen</h2><form id="mineForm"><label for="mineNumber">Personeelsnummer</label><div class="row"><input style="flex:1" id="mineNumber" inputmode="numeric" required value="${esc(state.number)}" placeholder="Personeelsnummer"><button class="primary">Mijn verlof tonen</button></div></form><div id="mineResults">${state.number?mineContent(state.number):'<p class="muted">Vul je personeelsnummer in om je aanvragen te bekijken.</p>'}</div></div><aside><div class="card"><h2>Status van je aanvraag</h2><p>${statusBadge('pending')} Wacht op een beslissing.</p><p>${statusBadge('approved')} Je verlof is bevestigd.</p><p>${statusBadge('rejected')} De aanvraag is afgekeurd.</p></div></aside></div>`}
function mineContent(n){const e=state.employees.find(x=>x.number===n);if(!e)return '<p class="muted">Geen medewerker gevonden met dit nummer.</p>';const mine=state.requests.filter(r=>r.employee_id===e.id).sort((a,b)=>a.date.localeCompare(b.date));return `<div class="stats" style="margin:15px 0"><div class="stat"><strong>${e.allowance}</strong><span>Jaarbudget</span></div><div class="stat"><strong>${e.charged}</strong><span>Goedgekeurd</span></div><div class="stat"><strong>${e.pending}</strong><span>In behandeling</span></div></div><p class="muted small">Verwacht resterend: <b>${e.allowance-e.charged-e.pending}</b> dagen, inclusief openstaande aanvragen.</p>${mine.length?mine.map(r=>`<div class="item row between"><div><b>${dateFmt(r.date)}</b>${statusBadge(r.status)} ${r.review_note?`<p class="muted small">${esc(r.review_note)}</p>`:''}</div>${r.status==='pending'?`<button data-cancel="${r.date}">Intrekken</button>`:''}</div>`).join(''):'<p class="muted">Je hebt nog geen verlof aangevraagd.</p>'}`}
function renderAdmin(){if(!state.token)return `<div class="card" style="max-width:500px"><h2>Beheer openen</h2><p class="muted">Voorbehouden aan de twee beheerders. Gebruik je personeelsnummer en de beheerderspincode.</p><form id="loginForm"><label>Personeelsnummer</label><input name="number" required inputmode="numeric" placeholder="Personeelsnummer"><label>Beheerderspincode</label><input name="pin" type="password" required placeholder="Pincode"><button class="primary fullwidth">Aanmelden</button></form></div>`;return `<div class="row between" style="margin-bottom:15px"><div class="tabs" style="flex-wrap:wrap">${adminTabs.map(([id,name])=>`<button class="${(state.adminTab||'dashboard')===id?'on':''}" data-admin-tab="${id}">${name}</button>`).join('')}</div><button id="logout">Afmelden</button></div>${({dashboard:adminDashboard,review:adminReview,team:adminTeam,rules:adminRules})[state.adminTab||'dashboard']()}`}
function adminDashboard(){const pending=state.requests.filter(r=>r.status==='pending'),approved=state.requests.filter(r=>r.status==='approved'),rejected=state.requests.filter(r=>r.status==='rejected');return `<div class="card"><h2>Beheeroverzicht</h2><div class="stats"><div class="stat"><strong>${pending.length}</strong><span>Te behandelen dagen</span></div><div class="stat"><strong>${approved.length}</strong><span>Goedgekeurd</span></div><div class="stat"><strong>${rejected.length}</strong><span>Afgekeurd</span></div></div><p class="muted small">Een periodeaanvraag bestaat uit afzonderlijke kalenderdagen. Je kunt elke dag apart beoordelen.</p><button class="primary" data-admin-tab="review">${pending.length} aanvragen behandelen →</button></div><div class="card"><h2>Meest recente openstaande aanvragen</h2>${reviewRows(pending.slice(0,12))}</div>`}
function reviewRows(rows){return rows.length?rows.map(r=>{const d=r.date,max=rule(d),other=active(d),conflict=other.length>max;return `<div class="item"><div class="row between"><div><b>${esc(r.name)} · ${dateFmt(d)}</b><span class="muted small">Bezetting ${other.length}/${max} ${conflict?' · ⚠ Overschrijding':''}</span></div>${statusBadge(r.status)}</div>${r.status!=='pending'&&r.review_note?`<p class="muted">${esc(r.review_note)}</p>`:''}<div class="actions" style="margin-top:9px"><button data-review="${r.id}" data-status="approved">✓ Goedkeuren</button><button data-review="${r.id}" data-status="rejected">✕ Afkeuren</button>${r.status!=='pending'?`<button data-review="${r.id}" data-status="pending">Heropenen</button>`:''}</div></div>`}).join(''):'<p class="muted">Geen aanvragen in deze categorie.</p>'}
function adminReview(){const list=state.requests.filter(r=>state.filter==='all'||r.status===state.filter).sort((a,b)=>a.date.localeCompare(b.date));return `<div class="card"><div class="row between"><h2>Aanvragen behandelen</h2><select id="reviewFilter" style="max-width:220px"><option value="pending" ${state.filter==='pending'?'selected':''}>In behandeling</option><option value="approved" ${state.filter==='approved'?'selected':''}>Goedgekeurd</option><option value="rejected" ${state.filter==='rejected'?'selected':''}>Afgekeurd</option><option value="all" ${state.filter==='all'?'selected':''}>Alle aanvragen</option></select></div><p class="muted small">Aanvragen worden niet automatisch afgewezen bij overschrijding. Jij neemt de beslissing.</p>${reviewRows(list)}</div>`}
function adminTeam(){const e=state.employeeEdit||{};return `<div class="grid"><div class="card"><h2>Team en verlofsaldo</h2><div class="tablewrap"><table><thead><tr><th>Naam</th><th>Nummer</th><th>Budget</th><th>Goedgekeurd</th><th>Lopend</th><th>Vrije dag</th><th></th></tr></thead><tbody>${state.employees.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.number)}</td><td>${x.allowance}</td><td>${x.charged}</td><td>${x.pending}</td><td>${x.day_off<0?'Geen':daysNames[x.day_off]}</td><td><button data-edit-employee="${esc(x.number)}">Bewerk</button></td></tr>`).join('')}</tbody></table></div></div><aside><div class="card"><h2>${e.number?'Medewerker wijzigen':'Medewerker toevoegen'}</h2><form id="employeeForm"><label>Naam</label><input name="name" required value="${esc(e.name||'')}"><label>Personeelsnummer</label><input name="number" required inputmode="numeric" value="${esc(e.number||'')}"><label>Jaarbudget (dagen)</label><input name="allowance" type="number" min="0" max="365" required value="${e.allowance??20}"><label>Standaard vrije dag</label><select name="day_off">${[[-1,'Geen'],[1,'Maandag'],[2,'Dinsdag'],[3,'Woensdag'],[4,'Donderdag'],[5,'Vrijdag'],[6,'Zaterdag'],[0,'Zondag']].map(([n,t])=>`<option value="${n}" ${Number(e.day_off??-1)===n?'selected':''}>${t}</option>`).join('')}</select><button class="primary fullwidth">Opslaan</button>${e.number?'<button type="button" id="clearEmployee" class="fullwidth">Nieuwe medewerker</button>':''}</form></div></aside></div>`}
function adminRules(){const p=state.periodEdit||{};return `<div class="grid"><div><div class="card"><h2>Indicatieve periodes</h2><p class="muted small">Schoolvakanties, solden en zondagsopeningen geven context en beïnvloeden het verlofsaldo niet.</p>${state.periods.map(x=>`<div class="item row between"><div><b>${esc(x.title)}</b><span class="muted small">${esc(x.kind)} · ${dateFmt(x.start_date)} – ${dateFmt(x.end_date)}</span></div><div class="actions"><button data-edit-period="${x.id}">Bewerk</button><button data-delete-period="${x.id}">Verwijder</button></div></div>`).join('')||'<p class="muted">Nog geen indicatieve periodes.</p>'}</div><div class="card"><h2>Belgische wettelijke feestdagen 2027</h2>${state.holidays.map(x=>`<div class="item row between"><span>${esc(x.title)}</span><b>${dateFmt(x.date)}</b></div>`).join('')}<p class="muted small">Vervangingsfeestdagen zijn niet automatisch opgenomen.</p></div></div><aside><div class="card"><h2>${p.id?'Periode wijzigen':'Periode toevoegen'}</h2><form id="periodForm"><label>Omschrijving</label><input name="title" required value="${esc(p.title||'')}"><label>Type</label><select name="kind">${['Schoolvakantie','Solden','Zondagsopening','Overig'].map(k=>`<option ${p.kind===k?'selected':''}>${k}</option>`).join('')}</select><label>Van</label><input name="start_date" type="date" min="2027-01-01" max="2027-12-31" required value="${esc(p.start_date||'')}"><label>Tot en met</label><input name="end_date" type="date" min="2027-01-01" max="2027-12-31" required value="${esc(p.end_date||'')}"><button class="primary fullwidth">Opslaan</button>${p.id?'<button type="button" id="clearPeriod" class="fullwidth">Nieuwe periode</button>':''}</form></div></aside></div>`}
function bind(){document.querySelectorAll('[data-date]').forEach(b=>b.onclick=()=>{state.selected=b.dataset.date;render()});document.querySelectorAll('[data-month]').forEach(b=>b.onclick=()=>{state.month=Number(b.dataset.month);state.yearMode=false;state.selected=dateString(state.month,1);render()});if($('yearToggle'))$('yearToggle').onclick=()=>{state.yearMode=true;render()};if($('monthToggle'))$('monthToggle').onclick=()=>{state.yearMode=false;render()};if($('prevMonth'))$('prevMonth').onclick=()=>{state.month--;state.selected=dateString(state.month,1);render()};if($('nextMonth'))$('nextMonth').onclick=()=>{state.month++;state.selected=dateString(state.month,1);render()};if($('applySelected'))$('applySelected').onclick=()=>navTo('apply');if($('applyForm')){const f=$('applyForm'),update=()=>{const n=f.elements.namedItem('number').value.trim(),e=state.employees.find(x=>x.number===n),a=f.elements.namedItem('start').value,b=f.elements.namedItem('end').value;if(!a||!b||b<a){$('applyPreview').textContent='Kies een geldige periode.';return}let dates=[];for(let t=Date.parse(a+'T12:00:00Z'),end=Date.parse(b+'T12:00:00Z');t<=end;t+=86400000)dates.push(new Date(t).toISOString().slice(0,10));const charge=e?dates.filter(d=>counted(d,e)).length:'?';$('applyPreview').textContent=`${dates.length} kalenderdagen geselecteerd · ${charge} aangerekende verlofdagen${dates.some(d=>active(d).length>=rule(d))?' · Let op: één of meer dagen zitten aan of boven het richtmaximum':''}.`};f.number.oninput=update;f.start.onchange=update;f.end.onchange=update;update();f.onsubmit=async ev=>{ev.preventDefault();const number=f.elements.namedItem('number').value.trim(),start_date=f.elements.namedItem('start').value,end_date=f.elements.namedItem('end').value;if(end_date<start_date)return notice('De einddatum ligt vóór de startdatum.','error');if(!confirm(`Verlof aanvragen van ${dateFmt(start_date)} tot en met ${dateFmt(end_date)}?`))return;try{await api('/api/request/bulk','POST',{number,start_date,end_date});state.number=number;sessionStorage.setItem('dv27number',number);await reload(false);navTo('mine');notice('Aanvraag opgeslagen. Ze staat nu in behandeling.','success')}catch(e){notice(e.message,'error')}}}
if($('mineForm'))$('mineForm').onsubmit=e=>{e.preventDefault();state.number=$('mineNumber').value.trim();sessionStorage.setItem('dv27number',state.number);render()};document.querySelectorAll('[data-cancel]').forEach(b=>b.onclick=async()=>{if(!confirm(`Aanvraag voor ${dateFmt(b.dataset.cancel)} intrekken?`))return;try{await api('/api/request/cancel','POST',{number:state.number,date:b.dataset.cancel});await reload(false);notice('Aanvraag ingetrokken.','success')}catch(e){notice(e.message,'error')}});
if($('loginForm'))$('loginForm').onsubmit=async e=>{e.preventDefault();const f=e.currentTarget;try{const data=await api('/api/admin/login','POST',{number:f.elements.namedItem('number').value,pin:f.elements.namedItem('pin').value});state.token=data.token;sessionStorage.setItem('dv27admin',state.token);state.adminTab='dashboard';render();notice('Beheer geopend.','success')}catch(err){notice(err.message,'error')}};if($('logout'))$('logout').onclick=()=>{state.token='';sessionStorage.removeItem('dv27admin');render()};document.querySelectorAll('[data-admin-tab]').forEach(b=>b.onclick=()=>{state.adminTab=b.dataset.adminTab;render()});if($('reviewFilter'))$('reviewFilter').onchange=e=>{state.filter=e.target.value;render()};document.querySelectorAll('[data-review]').forEach(b=>b.onclick=async()=>{const status=b.dataset.status,id=Number(b.dataset.review),note=status==='rejected'?prompt('Reden voor afkeuring (optioneel):',''):'';if(note===null)return;try{await api('/api/admin/review','POST',{id,status,note},true);await reload(false);notice('Beslissing opgeslagen.','success')}catch(e){notice(e.message,'error')}});
document.querySelectorAll('[data-edit-employee]').forEach(b=>b.onclick=()=>{state.employeeEdit=state.employees.find(e=>e.number===b.dataset.editEmployee);render()});if($('clearEmployee'))$('clearEmployee').onclick=()=>{state.employeeEdit=null;render()};if($('employeeForm'))$('employeeForm').onsubmit=async ev=>{ev.preventDefault();const f=ev.currentTarget;try{await api('/api/admin/employee','POST',{name:f.elements.namedItem('name').value,number:f.elements.namedItem('number').value,allowance:Number(f.elements.namedItem('allowance').value),day_off:Number(f.elements.namedItem('day_off').value),original_number:state.employeeEdit?.number||null},true);state.employeeEdit=null;await reload(false);notice('Medewerker opgeslagen.','success')}catch(e){notice(e.message,'error')}};
document.querySelectorAll('[data-edit-period]').forEach(b=>b.onclick=()=>{state.periodEdit=state.periods.find(p=>p.id===Number(b.dataset.editPeriod));render()});if($('clearPeriod'))$('clearPeriod').onclick=()=>{state.periodEdit=null;render()};document.querySelectorAll('[data-delete-period]').forEach(b=>b.onclick=async()=>{if(!confirm('Deze periode verwijderen?'))return;try{await api('/api/admin/period/'+b.dataset.deletePeriod,'DELETE',null,true);await reload(false);notice('Periode verwijderd.','success')}catch(e){notice(e.message,'error')}});if($('periodForm'))$('periodForm').onsubmit=async ev=>{ev.preventDefault();const f=ev.currentTarget;try{await api('/api/admin/period','POST',{id:state.periodEdit?.id||null,title:f.elements.namedItem('title').value,kind:f.elements.namedItem('kind').value,start_date:f.elements.namedItem('start_date').value,end_date:f.elements.namedItem('end_date').value},true);state.periodEdit=null;await reload(false);notice('Periode opgeslagen.','success')}catch(e){notice(e.message,'error')}}}
$('refreshBtn').onclick=()=>reload();render();reload();setInterval(()=>{if(document.visibilityState==='visible')reload(true)},15000);
</script></body></html>
